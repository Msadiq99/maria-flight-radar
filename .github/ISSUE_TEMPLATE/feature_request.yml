name: Feature request
description: Propose a compatible improvement
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem to solve }
    validations: { required: true }
  - type: textarea
    id: solution
    attributes: { label: Proposed solution }
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options: [Web, Backend, Local ADS-B, Firmware, Documentation]
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
  - type: textarea
    id: compatibility
    attributes: { label: Compatibility concerns }
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to contribute an implementation or validation evidence.
