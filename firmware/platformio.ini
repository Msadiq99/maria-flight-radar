; M5StickC PLUS2 (ESP32-PICO-V3-02). No dedicated PlatformIO board def exists yet;
; "m5stick-c" targets the same chip family and works for build/upload.
[env:m5stick-c-plus2]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    m5stack/M5Unified @ ^0.2.2
    bblanchon/ArduinoJson @ ^7.1.0
    tzapu/WiFiManager @ ^2.0.17

; ESP32-2432S028R / "Cheap Yellow Display" family.
; Pin profile is centralized in include/board_profiles/esp32_2432s028r.h and
; intentionally marked unverified until the exact PCB revision is inspected.
[env:maria-esp32-2432s028r]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_src_filter =
    +<*>
    -<imu_reader.cpp>
    -<telemetry_client.cpp>
build_flags =
    -D MARIA_ESP32_28_RADAR_TERMINAL=1
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D TOUCH_CS=33
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
    -D SPI_TOUCH_FREQUENCY=2500000
lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    bblanchon/ArduinoJson @ ^7.1.0
    tzapu/WiFiManager @ ^2.0.17
    bodmer/TFT_eSPI @ ^2.5.43
    XPT2046_Touchscreen

[env:maria-esp32-2432s028r-diag]
extends = env:maria-esp32-2432s028r
build_flags =
    ${env:maria-esp32-2432s028r.build_flags}
    -D MARIA_DIAGNOSTIC_MODE=1
    -D MARIA_FORCE_DEMO_MODE=1
    -D MARIA_VERBOSE_SERIAL=1

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<radar_model.cpp>
build_flags =
    -std=c++17
